<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/vega@6.2.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.1"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@7.1.0"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    const spec = {
  "$schema": "https://vega.github.io/schema/vega-lite/v6.json",
  "params": [
    {
      "name": "yearSelect",
      "value": 2000,
      "bind": {
        "input": "select",
        "options": [
          2000,
          2001,
          2002,
          2003,
          2004,
          2005,
          2006,
          2007,
          2008,
          2009,
          2010,
          2011,
          2012,
          2013,
          2014,
          2015,
          2016
        ],
        "name": "Year: "
      }
    },
    {
      "name": "statSelect",
      "value": "Disposable Income per Person",
      "bind": {
        "input": "select",
        "options": ["Disposable Income per Person", "Birth Rates"],
        "labels": ["Disposable Income per Person", "Birth Rates"],
        "name": "Statistic: "
      }
    }
  ],
  "title": {
    "text": "Exploring the Impact of the 2008 Financial Crisis",
    "subtitle": ["through Birthrate & Disposable Income Data", ""],
    "subtitleColor": "gray",
    "subtitleFontSize": 14,
    "fontSize": 24,
    "fontWeight": "bold",
    "anchor": "middle"
  },
  "data": {
    "name": "stats",
    "url": "https://gist.githubusercontent.com/xJustinJPD/a813ac35f320c9ee5dddabb8c9a6d46d/raw/e2d7b482e8788770eba0f8657925be251dbbae0c/ireland_income_and_birth_2000_2016.csv",
    "format": {"type": "csv"}
  },
  "transform": [
    {"calculate": "upper(datum.County)", "as": "COUNTY"},
    {
      "calculate": "statSelect == 'Disposable Income per Person' ? 'Income' : 'Birth Rates'",
      "as": "statNameShort"
    },
    {
      "calculate": "statSelect == 'Disposable Income per Person' ? 'Disposable Income per Person (€)' : 'Birth Rates (No. per 1000 Pop.)'",
      "as": "statNameLong"
    }
  ],
  "hconcat": [
    {
      "vconcat": [
        {
          "name": "map_view",
          "width": 300,
          "height": 300,
          "title": {
            "text": {"signal": "statSelect + ' by County, ' + yearSelect"}
          },
          "params": [
            {
              "name": "region_select",
              "select": {
                "type": "point",
                "fields": ["COUNTY"],
                "on": "click",
                "toggle": true
              }
            }
          ],
          "transform": [
            {"filter": "datum.Statistic == statSelect"},
            {"calculate": "toNumber(datum.Year)", "as": "YearNum"},
            {"filter": "datum.YearNum == yearSelect"},
            {"filter": "datum.County != 'Ireland'"},
            {
              "lookup": "COUNTY",
              "from": {
                "data": {
                  "name": "map",
                  "url": "https://gist.githubusercontent.com/avvo1/ca663cc7a61d6955c8b760ffe156084f/raw/2dc6771602a62ffbe5d8bbad9e2475bed95c50bb/ireland-counties-small.json",
                  "format": {"type": "json", "property": "features"}
                },
                "key": "properties.ENGLISH",
                "fields": ["geometry", "type", "properties"]
              }
            }
          ],
          "projection": {"type": "mercator"},
          "mark": {"type": "geoshape", "stroke": "white", "strokeWidth": 1},
          "encoding": {
            "color": {
              "field": "Value",
              "type": "quantitative",
              "title": {
                "signal": "statSelect == 'Disposable Income per Person'? 'Income (€)' : ['Birth Rates', '(No. per 1000 Pop.)']"
              },
              "scale": {"scheme": "greens"}
            },
            "opacity": {
              "condition": {"param": "region_select", "value": 1},
              "value": 0.2
            },
            "tooltip": [
              {"field": "County", "type": "nominal"},
              {
                "field": "Value",
                "title": "Value",
                "type": "quantitative",
                "format": ".1f"
              }
            ]
          }
        },
        {
          "name": "scatter_plot",
          "width": 320,
          "height": 320,
          "title": "Income vs Birth Rate, 2000-2016",
          "transform": [
            {"filter": "datum.County != 'Ireland'"},
            {
              "pivot": "Statistic",
              "value": "Value",
              "groupby": ["County", "Year", "COUNTY"]
            }
          ],
          "mark": {"type": "point", "filled": true, "size": 100},
          "encoding": {
            "x": {
              "field": "Disposable Income per Person",
              "type": "quantitative",
              "scale": {"zero": false},
              "axis": {"title": "Income (€)", "grid": false, "format": "s"}
            },
            "y": {
              "field": "Birth Rates",
              "type": "quantitative",
              "scale": {"zero": false},
              "axis": {"title": "Birth Rate", "grid": false}
            },
            "color": {
              "condition": [{"param": "region_select", "value": "black"}],
              "value": "lightgray"
            },
            "opacity": {
              "condition": {"param": "region_select", "value": 0.6},
              "value": 0.2
            },
            "tooltip": [
              {"field": "County", "type": "nominal"},
              {
                "field": "Disposable Income per Person",
                "title": "Income",
                "type": "quantitative",
                "format": ",.0f"
              },
              {"field": "Birth Rates", "type": "quantitative"}
            ]
          }
        }
      ],
      "resolve": {
        "scale": {"color": "independent"},
        "legend": {"color": "independent"}
      }
    },
    {
      "vconcat": [
        {
          "name": "line_chart",
          "width": 500,
          "height": 200,
          "title": {"text": {"signal": "statSelect + ' by County, 2000-2016'"}},
          "transform": [{"filter": "datum.Statistic == statSelect"}],
          "layer": [
            {
              "params": [
                {
                  "name": "region_select",
                  "select": {
                    "type": "point",
                    "fields": ["COUNTY"],
                    "on": "click",
                    "toggle": true
                  }
                }
              ],
              "name": "line_chart_all_counties",
              "transform": [{"filter": "datum.County != 'Ireland'"}],
              "mark": "line",
              "encoding": {
                "x": {
                  "field": "Year",
                  "type": "ordinal",
                  "title": null,
                  "axis": {
                    "title": "Year",
                    "labelAngle": 0,
                    "values": ["2000", "2004", "2008", "2012", "2016"]
                  },
                  "sort": "ascending"
                },
                "y": {
                  "field": "Value",
                  "type": "quantitative",
                  "axis": {
                    "title": {"signal": "data('stats')[0].statNameLong"},
                    "format": "s",
                    "grid": false
                  },
                  "scale": {"zero": false}
                },
                "color": {
                  "condition": [
                    {
                      "test": "length(data('region_select_store')) === 0",
                      "value": "lightgray"
                    },
                    {"param": "region_select", "value": "black"}
                  ],
                  "value": "darkgray"
                },
                "detail": {"field": "County", "type": "nominal"},
                "opacity": {
                  "condition": {"param": "region_select", "value": 1},
                  "value": 0.2
                },
                "strokeWidth": {
                  "condition": {"param": "region_select", "value": 1},
                  "value": 0.5
                },
                "tooltip": [
                  {"field": "COUNTY", "type": "nominal"},
                  {"field": "Year", "type": "ordinal"},
                  {"field": "Value", "type": "quantitative"}
                ]
              }
            },
            {
              "name": "line_chart_national_average",
              "transform": [{"filter": "datum.County == 'Ireland'"}],
              "mark": {
                "type": "line",
                "color": "firebrick",
                "strokeWidth": 5,
                "strokeDash": [4, 4]
              },
              "encoding": {
                "x": {"field": "Year", "type": "ordinal", "title": null},
                "y": {"field": "Value", "type": "quantitative"}
              }
            }
          ]
        },
        {
          "name": "lasagna_plot",
          "width": 500,
          "height": 400,
          "title": "Relative Change vs. Previous Year",
          "transform": [
            {"filter": "datum.Statistic == statSelect"},
            {"filter": "datum.County != 'Ireland'"}
          ],
          "layer": [
            {
              "mark": "rect",
              "params": [
                {
                  "name": "region_select",
                  "select": {
                    "type": "point",
                    "fields": ["COUNTY"],
                    "on": "click",
                    "toggle": true
                  }
                }
              ],
              "encoding": {
                "x": {
                  "field": "Year",
                  "type": "ordinal",
                  "axis": {
                    "title": "Year",
                    "labelAngle": 0,
                    "values": ["2000", "2004", "2008", "2012", "2016"]
                  }
                },
                "y": {
                  "field": "County",
                  "type": "nominal",
                  "axis": {"title": null}
                },
                "color": {
                  "field": "PctChangePrevYear",
                  "title": ["Annual", "% Change"],
                  "type": "quantitative",
                  "scale": {"scheme": "redblue", "domainMid": 0},
                  "legend": {"orient": "right", "offset": 5, "padding": 10}
                },
                "opacity": {
                  "condition": {"param": "region_select", "value": 1},
                  "value": 0.2
                },
                "tooltip": [
                  {"field": "County", "type": "nominal"},
                  {"field": "Year", "type": "ordinal"},
                  {
                    "field": "PctChangePrevYear",
                    "title": "% Change",
                    "type": "quantitative",
                    "format": ".1f"
                  }
                ]
              }
            }
          ]
        }
      ],
      "resolve": {
        "scale": {"color": "independent"},
        "legend": {"color": "independent"}
      }
    },
    {
      "vconcat": [
        {
          "width": 500,
          "height": 450,
          "mark": "rect",
          "params": [
            {
              "name": "region_select",
              "select": {
                "type": "point",
                "fields": ["COUNTY"],
                "on": "click",
                "toggle": true
              }
            }
          ],
          "title": {
            "text": {
              "signal": "'Normalised ' + statSelect + ' by County, 2000-2016'"
            }
          },
          "transform": [
            {"calculate": "upper(datum.County)", "as": "COUNTY"},
            {"filter": "datum.Statistic == statSelect"},
            {"filter": "datum.County != 'Ireland'"}
          ],
          "encoding": {
            "x": {
              "field": "Year",
              "type": "ordinal",
              "axis": {
                "title": "Year",
                "labelAngle": 0,
                "values": ["2000", "2004", "2008", "2012", "2016"]
              }
            },
            "color": {
              "field": "Norm",
              "type": "quantitative",
              "title": "All Values Normalised: 0-100",
              "scale": {"scheme": "redblue", "domainMid": 50}
            },
            "y": {"field": "County", "type": "nominal", "title": null},
            "opacity": {
              "condition": {"param": "region_select", "value": 1},
              "value": 0.2
            },
            "tooltip": [
              {"field": "County"},
              {"field": "Year"},
              {"field": "Norm", "title": "Normalised Value"}
            ]
          }
        }
      ]
    }
  ],
  "resolve": {
    "scale": {"color": "independent"},
    "legend": {"color": "independent"}
  },
  "config": {
    "font": "Inter, Segoe UI, sans-serif",
    "axis": {"domain": true, "titleFontSize": 12},
    "view": {"stroke": null}
  }
};
    vegaEmbed("#vis", spec, {mode: "vega-lite"}).then(console.log).catch(console.warn);
  </script>
</body>
</html>
